<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel IPTV Player (Proxy Mode)</title>
    <!-- นำเข้าไลบรารี HLS.js สำหรับเล่นไฟล์ m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            background-color: #111; 
            color: #fff; 
            font-family: sans-serif;
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        .video-container {
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video { 
            width: 100%; 
            height: auto; 
            outline: none; 
            display: block;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>🎥 Live TV Player (Proxy Mode)</h2>
    
    <div class="video-container">
        <video id="video" controls autoplay></video>
    </div>
    
    <div class="status" id="statusText">กำลังโหลดสตรีม...</div>

    <script>
        // 🎯 1. ใส่ลิงก์เป้าหมาย (HTTP) ของ MAC Portal ที่ต้องการเล่น 
        // (สามารถใช้ลิงก์ raw ของ github หรือ ลิงก์ http ตรงๆ ได้เลย)
        const targetUrl = 'http://ultratv.one:2095/live/hCPtsREFtA/Xj25tg0ZXi/115415.m3u8';
        
        // 🛡️ 2. หุ้มด้วย Proxy ของเรา (เรียกไปที่ไฟล์ api/proxy.js บน Vercel)
        const m3u8Url = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;

        const video = document.getElementById('video');
        const statusText = document.getElementById('statusText');

        // 3. ตรวจสอบและเล่นวิดีโอ
        if (Hls.isSupported()) {
            const hls = new Hls({
                // ช่วยปรับแต่งให้รับสตรีมผ่าน Proxy ได้ไหลลื่นขึ้น
                maxBufferSize: 30 * 1000 * 1000, 
                maxBufferLength: 30,
            });
            
            hls.loadSource(m3u8Url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                statusText.innerText = "✅ เชื่อมต่อผ่าน Proxy สำเร็จ! กำลังเล่น...";
                video.play().catch(e => console.log("Auto-play prevented:", e));
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    statusText.innerText = "❌ เกิดข้อผิดพลาดในการดึงข้อมูลสตรีม";
                    console.error("HLS.js Error:", data);
                }
            });
        } 
        // สำหรับ Safari (iOS/macOS) ที่รองรับ m3u8 ในตัวโดยไม่ต้องใช้ HLS.js
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = m3u8Url;
            video.addEventListener('loadedmetadata', function() {
                statusText.innerText = "✅ เชื่อมต่อสำเร็จ! กำลังเล่น...";
                video.play().catch(e => console.log("Auto-play prevented:", e));
            });
        } else {
            statusText.innerText = "❌ เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์สตรีมมิ่ง";
        }
    </script>

</body>
</html>
